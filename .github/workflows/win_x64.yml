name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Flutter version
        id: sdk_version
        shell: pwsh
        run: |
          $taskSdkVersion = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          "version=$taskSdkVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: ${{ steps.sdk_version.outputs.version }}

      - name: Add Inno Setup
        run: |
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze --no-pub --no-fatal-infos lib test
          if ($LASTEXITCODE -ne 0) { throw 'Flutter analysis failed' }
          flutter test test --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }

      - name: Build Windows
        run: |
          flutter build windows --release --dart-define-from-file=pili_release.json --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Windows release compilation failed' }

      - name: Test Windows touch and system integrations
        shell: pwsh
        run: |
          $taskCache = Get-Content build/windows/x64/CMakeCache.txt
          $taskGenerator = (($taskCache | Where-Object { $_.StartsWith('CMAKE_GENERATOR:INTERNAL=') }) -split '=', 2)[1]
          $taskInstance = (($taskCache | Where-Object { $_.StartsWith('CMAKE_GENERATOR_INSTANCE:INTERNAL=') }) -split '=', 2)[1]
          if (-not $taskGenerator -or -not $taskInstance) { throw 'Windows build toolchain missing from CMake cache' }
          cmake -S tool/tests -B .fvm/native-tests -G $taskGenerator -A x64 "-DCMAKE_GENERATOR_INSTANCE=$taskInstance"
          if ($LASTEXITCODE -ne 0) { throw 'Native test configuration failed' }
          cmake --build .fvm/native-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
          & .fvm/native-tests/Release/windows_touch_input_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows touch regression failed' }
          & .fvm/native-tests/Release/windows_integrations_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows integration regression failed' }

      - name: Add runtime and package installer
        shell: pwsh
        run: |
          $taskInstance = Get-Content build/windows/x64/CMakeCache.txt | Where-Object { $_.StartsWith('CMAKE_GENERATOR_INSTANCE:INTERNAL=') } | Select-Object -First 1
          $taskVisualStudio = ($taskInstance -split '=', 2)[1]
          tool/prepare_windows_runtime.ps1 -Bundle build/windows/x64/runner/Release -VisualStudioRoot $taskVisualStudio
          $taskMetadata = Get-Content pili_release.json -Raw | ConvertFrom-Json
          $taskManifest = @{ mode = 'release'; touchLoggingEnabled = $false; appVersion = $taskMetadata.'pili.name' + '+' + $taskMetadata.'pili.code'; appCommit = $taskMetadata.'pili.hash' }
          $taskManifest | ConvertTo-Json | Set-Content build/windows/x64/runner/Release/release-build.json -Encoding utf8
          New-Item -ItemType Directory -Path .fvm -Force | Out-Null
          tool/package_windows_release.ps1 -InnoCompiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"

      - name: Prepare Upload
        run: |
          mkdir -p Release/Pilipili-Win
          mkdir -p Pilipili-Win-Setup
          mv build/windows/x64/runner/Release/* Release/Pilipili-Win/
          mv dist/*.exe Pilipili-Win-Setup/Pilipili_windows_${{env.version}}_x64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/Pilipili-Win" -DestinationPath "Pilipili_windows_${{env.version}}_x64_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          files: |
            Pilipili_windows_*.zip
            Pilipili-Win-Setup/Pilipili_windows_*.exe

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: Pilipili_windows_*.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: Pilipili-Win-Setup/Pilipili_windows_*.exe
